name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Compilar y pruebas unitarias/integración
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: mvn verify
        run: set -o pipefail; mvn -B -ntp -fae verify 2>&1 | tee build.log
      - name: Resumen de errores
        if: failure()
        run: |
          .github/scripts/anotar-log.sh build.log "mvn verify"
          for f in $(grep -l -E "FAILURE|ERROR" */target/surefire-reports/*.txt 2>/dev/null); do
            .github/scripts/anotar-log.sh "$f" "test $(basename $f .txt)"
          done
      - name: Reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.txt'
          if-no-files-found: ignore

  e2e:
    name: Prueba de punta a punta (docker compose)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Construir imágenes
        run: docker compose build
      - name: Levantar el sistema
        run: docker compose up -d --wait --wait-timeout 600 || (docker compose ps; exit 1)
      - name: Estado
        run: docker compose ps
      - name: Prueba de humo
        run: set -o pipefail; ./scripts/prueba-humo.sh 2>&1 | tee humo.log
      - name: Demo del video (no interactiva)
        run: |
          sleep 30
          yes "" | ./scripts/demo-video.sh 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | tee demo.log
          csplit -s -z -f escena- demo.log '/^ESCENA /' '{*}' || true
          for f in escena-*; do
            RES=$(grep -vE '^\s*$|ENTER para' "$f" | tr -s ' ' | head -c 3800); RES="${RES//'%'/'%25'}"; RES="${RES//$'\n'/'%0A'}"
            echo "::notice title=demo $f::${RES}"
          done
      - name: Logs (si falla)
        if: failure()
        run: |
          docker compose ps -a > ps.log 2>&1
          .github/scripts/anotar-log.sh ps.log "docker compose ps"
          [ -f humo.log ] && .github/scripts/anotar-log.sh humo.log "prueba de humo"
          for s in ms-pagos api-gateway ms-cuentas ms-clientes bff-web bff-atm batch-service; do
            docker compose logs --no-color --tail=400 $s 2>&1 | grep -E "WARN|ERROR|Exception|Caused by" | grep -vE "sasl|Bean Validation|RebalanceInProgress" > svc-$s.log
            if [ -s svc-$s.log ]; then .github/scripts/anotar-log.sh svc-$s.log "logs $s"; fi
          done
