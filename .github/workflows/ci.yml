name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Compilar y pruebas unitarias/integración
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: mvn verify
        run: mvn -B -ntp verify
      - name: Reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.txt'
          if-no-files-found: ignore

  e2e:
    name: Prueba de punta a punta (docker compose)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Construir imágenes
        run: docker compose build
      - name: Levantar el sistema
        run: docker compose up -d --wait --wait-timeout 600 || (docker compose ps; exit 1)
      - name: Estado
        run: docker compose ps
      - name: Prueba de humo
        run: ./scripts/prueba-humo.sh
      - name: Logs (si falla)
        if: failure()
        run: docker compose logs --no-color --tail=200
