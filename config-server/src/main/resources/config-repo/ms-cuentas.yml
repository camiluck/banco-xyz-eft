server:
  port: ${PORT:8081}

spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:cuentas;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none   # el esquema lo crea Flyway (src/main/resources/db/migration)
    open-in-view: false
  kafka:
    consumer:
      group-id: ms-cuentas

cuentas:
  pin:
    intentos-maximos: 3
